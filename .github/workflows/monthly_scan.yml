name: Monthly NHTSA complaint pull

on:
  schedule:
    - cron: "0 11 1 * *"   # 1st of every month, 11:00 UTC (~6-7am ET)
  workflow_dispatch:        # also allows a manual "Run now" button in GitHub

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download latest NHTSA complaints
        run: python fetch_nhtsa.py
      - name: Save the new data to the repo
        run: |
          git config user.name "defect-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/complaints_live.csv
          git commit -m "Monthly NHTSA complaint pull $(date +%Y-%m)" || echo "No changes"
          git push
